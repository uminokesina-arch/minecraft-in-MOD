<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>質問掲示板 | PC・マイクラ研究所</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Yu Gothic", "Meiryo", sans-serif;
      background: #f2f2f2; color: #222; line-height: 1.6;
    }
    header { background: #222; color: white; text-align: center; padding: 24px 12px; }
    header h1 { margin: 0; font-size: clamp(22px, 4vw, 32px); }
    header p { margin: 6px 0 0; }
    main { max-width: 900px; margin: 28px auto; padding: 0 16px; }
    h2 { border-bottom: 3px solid #333; padding-bottom: 8px; }
    .panel, .question {
      background: white; padding: 20px; margin: 18px 0; border-radius: 10px;
      box-shadow: 0 2px 8px #00000012;
    }
    label { display: block; margin: 12px 0 5px; font-weight: bold; }
    input, textarea {
      width: 100%; padding: 11px; border: 1px solid #bbb; border-radius: 6px;
      font: inherit; background: white;
    }
    textarea { resize: vertical; }
    button {
      border: 0; border-radius: 6px; padding: 10px 18px; margin-top: 12px;
      background: #333; color: white; font: inherit; cursor: pointer;
    }
    button:hover { background: #555; }
    .answer-form { border-top: 1px solid #ddd; margin-top: 16px; padding-top: 12px; }
    .answer { background: #f6f6f6; border-radius: 6px; padding: 10px 14px; margin: 10px 0; }
    .meta { color: #666; font-size: 13px; }
    .empty { color: #666; }
    .back { display: inline-block; margin: 12px 0 28px; color: #1769aa; }
    .notice { font-size: 13px; color: #6b4c00; background: #fff4d5; padding: 10px 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>PC・マイクラ研究所</h1>
    <p>みんなで質問・回答しよう！</p>
  </header>

  <main>
    <h2>質問掲示板</h2>
    <p class="notice">
      試作版：投稿内容はこのブラウザ内に保存されます。今は他の人の端末とは共有されません。
      本当に誰でも投稿・閲覧できる公開掲示板にするには、オンラインの保存先を接続する必要があります。
    </p>

    <section class="panel">
      <h3>質問を投稿する</h3>
      <form id="questionForm">
        <label for="nickname">ニックネーム（任意）</label>
        <input id="nickname" maxlength="30" placeholder="例：マイクラ好き">

        <label for="title">質問タイトル</label>
        <input id="title" maxlength="100" required placeholder="例：Forge 1.20.1が起動しません">

        <label for="content">質問内容</label>
        <textarea id="content" rows="5" maxlength="3000" required placeholder="困っていることを書いてね"></textarea>

        <button type="submit">質問を投稿</button>
      </form>
    </section>

    <section>
      <h3>質問一覧</h3>
      <div id="questionList"></div>
    </section>

    <a class="back" href="index.html">← トップページへ戻る</a>
  </main>

  <script>
    const questionForm = document.getElementById("questionForm");
    const nicknameInput = document.getElementById("nickname");
    const titleInput = document.getElementById("title");
    const contentInput = document.getElementById("content");
    const questionList = document.getElementById("questionList");
    const STORAGE_KEY = "pcMinecraftLabQuestions";

    function loadQuestions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    let questions = loadQuestions();

    function saveQuestions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(questions));
    }

    function makeTextElement(tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      return element;
    }

    function renderQuestions() {
      questionList.replaceChildren();

      if (questions.length === 0) {
        questionList.appendChild(makeTextElement("p", "まだ質問はありません。", "empty"));
        return;
      }

      [...questions].reverse().forEach((question) => {
        const card = document.createElement("article");
        card.className = "question";
        card.appendChild(makeTextElement("h4", question.title));
        card.appendChild(makeTextElement("p", question.content));
        card.appendChild(makeTextElement("p", "投稿者：" + (question.nickname || "匿名"), "meta"));

        const answersArea = document.createElement("div");
        if (!question.answers || question.answers.length === 0) {
          answersArea.appendChild(makeTextElement("p", "まだ回答はありません。", "empty"));
        } else {
          question.answers.forEach((answer) => {
            const answerBox = document.createElement("div");
            answerBox.className = "answer";
            answerBox.appendChild(makeTextElement("p", answer.content));
            answerBox.appendChild(makeTextElement("p", "回答者：" + (answer.nickname || "匿名"), "meta"));
            answersArea.appendChild(answerBox);
          });
        }
        card.appendChild(answersArea);

        const answerForm = document.createElement("form");
        answerForm.className = "answer-form";
        const answerName = document.createElement("input");
        answerName.maxLength = 30;
        answerName.placeholder = "ニックネーム（任意）";
        answerName.setAttribute("aria-label", "回答者ニックネーム");
        const answerText = document.createElement("textarea");
        answerText.rows = 3;
        answerText.maxLength = 3000;
        answerText.required = true;
        answerText.placeholder = "回答を書く";
        answerText.setAttribute("aria-label", "回答内容");
        const answerButton = document.createElement("button");
        answerButton.type = "submit";
        answerButton.textContent = "回答する";
        answerForm.append(answerName, answerText, answerButton);

        answerForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const content = answerText.value.trim();
          if (!content) return;
          question.answers = question.answers || [];
          question.answers.push({
            nickname: answerName.value.trim() || "匿名",
            content
          });
          saveQuestions();
          renderQuestions();
        });

        card.appendChild(answerForm);
        questionList.appendChild(card);
      });
    }

    questionForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      if (!title || !content) {
        alert("タイトルと質問内容を入力してね！");
        return;
      }

      questions.push({
        id: Date.now(),
        nickname: nicknameInput.value.trim() || "匿名",
        title,
        content,
        answers: []
      });
      saveQuestions();
      renderQuestions();
      questionForm.reset();
    });

    renderQuestions();
  </script>
</body>
</html>
